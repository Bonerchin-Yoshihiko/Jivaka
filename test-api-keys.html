<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIキー切り替えテスト</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .panel {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .active {
            background: linear-gradient(45deg, #6366f1, #ec4899);
            color: white;
        }
        .inactive {
            background: #444;
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #444;
            border-radius: 5px;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
        }
        .log {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-line {
            margin: 2px 0;
            padding: 2px 5px;
        }
        .log-info { color: #4ade80; }
        .log-warn { color: #fbbf24; }
        .log-error { color: #f87171; }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            margin-left: 10px;
            font-size: 12px;
        }
        .status-ok { background: #22c55e; color: white; }
        .status-empty { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <h1>🔑 APIキー切り替えテスト</h1>
    
    <div class="panel">
        <h2>プロバイダー選択</h2>
        <button id="btnClaude" class="active">🧠 Claude</button>
        <button id="btnGemini" class="inactive">✨ Gemini</button>
    </div>

    <div class="panel">
        <h2>APIキー入力</h2>
        <label>
            <span id="providerLabel">Claude</span> APIキー
            <span id="keyStatus" class="status status-empty">未設定</span>
        </label>
        <input type="text" id="apiKeyInput" placeholder="APIキーを入力...">
        <button id="btnSave" style="background: #22c55e; color: white; width: 100%;">💾 保存</button>
    </div>

    <div class="panel">
        <h2>保存済みキー</h2>
        <div>
            Claude: <code id="savedClaude" style="color: #4ade80;">-</code>
        </div>
        <div>
            Gemini: <code id="savedGemini" style="color: #4ade80;">-</code>
        </div>
    </div>

    <div class="panel">
        <h2>ログ</h2>
        <div id="log" class="log"></div>
    </div>

    <script>
        // 状態
        let currentProvider = 'claude';
        let claudeKey = '';
        let geminiKey = '';

        // 要素
        const btnClaude = document.getElementById('btnClaude');
        const btnGemini = document.getElementById('btnGemini');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const btnSave = document.getElementById('btnSave');
        const providerLabel = document.getElementById('providerLabel');
        const keyStatus = document.getElementById('keyStatus');
        const savedClaude = document.getElementById('savedClaude');
        const savedGemini = document.getElementById('savedGemini');
        const logDiv = document.getElementById('log');

        // ログ関数
        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // UIを更新
        function updateUI() {
            log(`🔄 UI更新: プロバイダー = ${currentProvider}`, 'info');
            
            // ボタンの状態
            if (currentProvider === 'claude') {
                btnClaude.className = 'active';
                btnGemini.className = 'inactive';
                providerLabel.textContent = 'Claude';
                apiKeyInput.value = claudeKey;
                apiKeyInput.placeholder = 'sk-ant-api03-...';
            } else {
                btnClaude.className = 'inactive';
                btnGemini.className = 'active';
                providerLabel.textContent = 'Gemini';
                apiKeyInput.value = geminiKey;
                apiKeyInput.placeholder = 'AIza...';
            }

            // ステータス表示
            const currentKey = currentProvider === 'claude' ? claudeKey : geminiKey;
            if (currentKey) {
                keyStatus.textContent = '設定済み';
                keyStatus.className = 'status status-ok';
            } else {
                keyStatus.textContent = '未設定';
                keyStatus.className = 'status status-empty';
            }

            // 保存済みキー表示
            savedClaude.textContent = claudeKey ? `${claudeKey.substring(0, 20)}...` : '未設定';
            savedGemini.textContent = geminiKey ? `${geminiKey.substring(0, 20)}...` : '未設定';
        }

        // プロバイダー切り替え
        btnClaude.addEventListener('click', () => {
            log('🧠 Claudeに切り替え', 'info');
            currentProvider = 'claude';
            updateUI();
        });

        btnGemini.addEventListener('click', () => {
            log('✨ Geminiに切り替え', 'info');
            currentProvider = 'gemini';
            updateUI();
        });

        // 保存
        btnSave.addEventListener('click', () => {
            const value = apiKeyInput.value.trim();
            
            if (!value) {
                log('⚠️ APIキーが空です', 'warn');
                return;
            }

            if (currentProvider === 'claude') {
                claudeKey = value;
                log(`💾 Claude APIキーを保存: ${value.substring(0, 20)}...`, 'info');
            } else {
                geminiKey = value;
                log(`💾 Gemini APIキーを保存: ${value.substring(0, 20)}...`, 'info');
            }

            updateUI();
            alert(`${currentProvider === 'claude' ? 'Claude' : 'Gemini'} APIキーを保存しました！`);
        });

        // 初期化
        log('🚀 テストページ初期化', 'info');
        updateUI();
    </script>
</body>
</html>

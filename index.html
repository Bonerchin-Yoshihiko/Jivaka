<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌿 Jīvaka - 8bit Ayurveda</title>

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jīvaka">
    <meta name="theme-color" content="#5e2563">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="古代インドの名医にちなんだ薬草調合データベース">

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <!-- Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 8bit/ピクセルフォント -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ========================================
           🎮 8-BIT ANCIENT INDIA PSYCHEDELIC THEME
           ======================================== */
        
        * {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'DotGothic16', 'Press Start 2P', monospace;
            background: #1a0b2e;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #feca57, transparent),
                radial-gradient(2px 2px at 40px 70px, #ff6b9d, transparent),
                radial-gradient(2px 2px at 50px 160px, #48dbfb, transparent),
                radial-gradient(2px 2px at 90px 40px, #ff9ff3, transparent),
                radial-gradient(2px 2px at 130px 80px, #feca57, transparent),
                radial-gradient(2px 2px at 160px 120px, #ff6b9d, transparent),
                repeating-linear-gradient(0deg, transparent 0px, transparent 8px, rgba(255, 107, 157, 0.03) 8px, rgba(255, 107, 157, 0.03) 16px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 8px, rgba(254, 202, 87, 0.03) 8px, rgba(254, 202, 87, 0.03) 16px),
                linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 25%, #5e2563 50%, #1a0b2e 100%);
            background-attachment: fixed;
            background-size: 200px 200px, 200px 200px, 200px 200px, 200px 200px, 200px 200px, 200px 200px, 16px 16px, 16px 16px, 100% 100%;
            min-height: 100vh;
            /* iOS Safe Area */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            /* タッチスクロール最適化 */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        
        /* 8bitフォントスタイル */
        h1, h2, h3, .pixel-title {
            font-family: 'Silkscreen', 'Press Start 2P', monospace;
            letter-spacing: 2px;
        }
        
        .psychedelic-text {
            font-family: 'Silkscreen', 'Press Start 2P', monospace;
            background: linear-gradient(45deg, #ff6b9d, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pixel-gradient 2s steps(8) infinite;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5), -1px -1px 0px rgba(255, 255, 255, 0.1);
        }
        
        @keyframes pixel-gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .neon-border {
            box-shadow: 0 0 0 4px #ff6b9d, 0 0 0 8px #2d1b4e, 0 0 0 12px #feca57, inset 0 0 0 4px rgba(255, 107, 157, 0.3);
            border: none;
        }
        
        .herb-card {
            transition: all 0.1s steps(4);
            background: linear-gradient(135deg, rgba(45, 27, 78, 0.9) 0%, rgba(94, 37, 99, 0.9) 100%);
            border: 4px solid #ff6b9d;
            box-shadow: 8px 8px 0px #1a0b2e, inset -4px -4px 0px rgba(0, 0, 0, 0.3), inset 4px 4px 0px rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .herb-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.1) 2px, rgba(0, 0, 0, 0.1) 4px);
            pointer-events: none;
        }
        
        .herb-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px #1a0b2e, 0 0 20px rgba(255, 107, 157, 0.5), inset -4px -4px 0px rgba(0, 0, 0, 0.3), inset 4px 4px 0px rgba(255, 255, 255, 0.1);
            border-color: #feca57;
        }
        
        .tab-button {
            position: relative;
            transition: all 0.1s steps(2);
            background: linear-gradient(180deg, #3d2b5e 0%, #2d1b4e 100%);
            border: 4px solid #5e2563;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            box-shadow: inset -2px -2px 0px rgba(0, 0, 0, 0.5), inset 2px 2px 0px rgba(255, 255, 255, 0.1);
            font-family: 'DotGothic16', monospace;
        }
        
        .tab-button.active {
            background: linear-gradient(180deg, #ff6b9d 0%, #e05080 100%);
            border-color: #feca57;
            box-shadow: 0 -4px 0px #feca57, inset -2px -2px 0px rgba(0, 0, 0, 0.3), inset 2px 2px 0px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }
        
        .tab-button.active::after {
            content: '▼';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: #feca57;
            font-size: 8px;
            text-shadow: 0 0 10px #feca57;
        }
        
        .gradient-button {
            background: linear-gradient(180deg, #ff6b9d 0%, #d44d7a 50%, #ff6b9d 51%, #c44070 100%);
            border: 4px solid #feca57;
            box-shadow: 4px 4px 0px #1a0b2e, inset -2px -2px 0px rgba(0, 0, 0, 0.4), inset 2px 2px 0px rgba(255, 255, 255, 0.3);
            font-family: 'DotGothic16', monospace;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
            transition: all 0.1s steps(2);
            position: relative;
            overflow: hidden;
        }
        
        .gradient-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: pixel-shine 3s steps(10) infinite;
        }
        
        @keyframes pixel-shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        
        .gradient-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1a0b2e, 0 0 20px rgba(255, 107, 157, 0.5), inset -2px -2px 0px rgba(0, 0, 0, 0.4), inset 2px 2px 0px rgba(255, 255, 255, 0.3);
        }
        
        .gradient-button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1a0b2e, inset -2px -2px 0px rgba(0, 0, 0, 0.4), inset 2px 2px 0px rgba(255, 255, 255, 0.3);
        }
        
        .psychedelic-input {
            background: #1a0b2e;
            border: 4px solid #ff6b9d;
            color: #fff;
            font-family: 'DotGothic16', monospace;
            box-shadow: inset 4px 4px 0px rgba(0, 0, 0, 0.5), inset -2px -2px 0px rgba(255, 255, 255, 0.05);
            transition: all 0.1s steps(2);
            /* iOS: フォーカス時のズーム防止 */
            font-size: 16px;
        }
        
        .psychedelic-input:focus {
            outline: none;
            border-color: #feca57;
            box-shadow: 0 0 0 4px rgba(254, 202, 87, 0.3), inset 4px 4px 0px rgba(0, 0, 0, 0.5);
        }
        
        .psychedelic-input::placeholder {
            color: #ff6b9d;
            opacity: 0.6;
        }
        
        .notification {
            animation: pixel-slide-in 0.5s steps(10);
            background: linear-gradient(180deg, #feca57 0%, #e0a030 50%, #feca57 51%, #d09020 100%);
            border: 4px solid #ff6b9d;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.5), inset -2px -2px 0px rgba(0, 0, 0, 0.3), inset 2px 2px 0px rgba(255, 255, 255, 0.3);
            font-family: 'DotGothic16', monospace;
        }
        
        @keyframes pixel-slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .retro-badge {
            background: linear-gradient(180deg, #ff6b9d 0%, #d44d7a 50%, #ff6b9d 51%, #c44070 100%);
            padding: 4px 12px;
            border: 2px solid #feca57;
            border-radius: 0;
            font-family: 'DotGothic16', monospace;
            font-weight: bold;
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.5);
            box-shadow: 2px 2px 0px #1a0b2e;
        }
        
        .glass-panel {
            background: linear-gradient(180deg, rgba(45, 27, 78, 0.95) 0%, rgba(26, 11, 46, 0.95) 100%);
            border: 4px solid #5e2563;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.5), inset -4px -4px 0px rgba(0, 0, 0, 0.3), inset 4px 4px 0px rgba(255, 255, 255, 0.05);
            position: relative;
        }
        
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #ff6b9d, #feca57, #48dbfb, #ff9ff3);
        }
        
        ::-webkit-scrollbar { width: 16px; }
        ::-webkit-scrollbar-track { background: #1a0b2e; border-left: 4px solid #2d1b4e; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff6b9d 0%, #d44d7a 50%, #ff6b9d 51%, #c44070 100%);
            border: 2px solid #feca57; border-radius: 0;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #feca57 0%, #d0a040 50%, #feca57 51%, #c09030 100%);
        }
        
        .lotus-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='32' height='32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='14' y='4' width='4' height='4' fill='%23ff6b9d' opacity='0.3'/%3E%3Crect x='10' y='8' width='4' height='4' fill='%23ff6b9d' opacity='0.3'/%3E%3Crect x='18' y='8' width='4' height='4' fill='%23ff6b9d' opacity='0.3'/%3E%3Crect x='6' y='12' width='4' height='4' fill='%23feca57' opacity='0.3'/%3E%3Crect x='14' y='12' width='4' height='4' fill='%23feca57' opacity='0.3'/%3E%3Crect x='22' y='12' width='4' height='4' fill='%23feca57' opacity='0.3'/%3E%3C/svg%3E");
            background-size: 32px 32px;
        }
        
        @keyframes pixel-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes pixel-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .pixel-pulse { animation: pixel-pulse 1s steps(4) infinite; }
        .pixel-float { animation: pixel-float 2s steps(8) infinite; }
        
        .crt-effect::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.1) 2px, rgba(0, 0, 0, 0.1) 4px);
            pointer-events: none;
            z-index: 9999;
        }
        
        select.psychedelic-input {
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 6 L8 10 L12 6' stroke='%23feca57' stroke-width='2' fill='none'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 32px;
        }
        
        textarea.psychedelic-input { resize: vertical; min-height: 80px; }
        
        .animate-spin { animation: pixel-spin 1s steps(8) infinite; }
        @keyframes pixel-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .rpg-dialog {
            border: 4px solid #feca57;
            border-image: url("data:image/svg+xml,%3Csvg width='12' height='12' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='4' height='4' fill='%23feca57'/%3E%3Crect x='4' width='4' height='4' fill='%23ff6b9d'/%3E%3Crect x='8' width='4' height='4' fill='%23feca57'/%3E%3Crect y='4' width='4' height='4' fill='%23ff6b9d'/%3E%3Crect x='4' y='4' width='4' height='4' fill='%232d1b4e'/%3E%3Crect x='8' y='4' width='4' height='4' fill='%23ff6b9d'/%3E%3Crect y='8' width='4' height='4' fill='%23feca57'/%3E%3Crect x='4' y='8' width='4' height='4' fill='%23ff6b9d'/%3E%3Crect x='8' y='8' width='4' height='4' fill='%23feca57'/%3E%3C/svg%3E") 4 round;
        }
        
        .pixel-toggle {
            width: 48px; height: 24px;
            background: #1a0b2e;
            border: 4px solid #5e2563;
            position: relative;
            cursor: pointer;
        }
        .pixel-toggle::after {
            content: '';
            position: absolute;
            width: 12px; height: 12px;
            background: #ff6b9d;
            top: 2px; left: 2px;
            transition: left 0.1s steps(4);
        }
        .pixel-toggle.active::after {
            left: calc(100% - 14px);
            background: #feca57;
        }
        
        .pixel-coin {
            display: inline-block;
            width: 16px; height: 16px;
            background: linear-gradient(135deg, #feca57 0%, #d0a040 50%, #feca57 100%);
            border: 2px solid #c09030;
            border-radius: 0;
            animation: coin-shine 2s steps(4) infinite;
        }
        @keyframes coin-shine { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        /* モーダル背景: 親の space-y-* が付ける margin-top で上端がずれ、
           ヘッダーがモーダルの上に見えてしまう（押せてしまう）のを防ぐ */
        .fixed.inset-0 {
            margin: 0 !important;
        }
        /* モーダル内の固定見出し（✕ボタン付き）を、スクロールした中身より手前に表示する */
        .fixed.inset-0 .sticky.top-0 {
            z-index: 10;
        }

        /* =========================================
           📱 MOBILE RESPONSIVE STYLES
           ========================================= */

        /* --- スマートフォン (〜767px) --- */
        @media (max-width: 767px) {
            /* 横方向のはみ出しをページ全体のスクロールにしない
               (clip はスクロールコンテナを作らないので sticky を壊さない) */
            #root {
                overflow-x: clip;
            }

            /* ===== ヘッダー: 1行に収まるようコンパクト化（入りきらない端末では2行に折り返し） ===== */
            header .max-w-7xl {
                padding: 8px 12px !important;
            }
            header .max-w-7xl > .flex {
                flex-wrap: wrap;
                row-gap: 6px;
                column-gap: 8px;
            }
            header .flex.items-center.space-x-4 > * + * {
                margin-left: 6px !important;
            }
            header .text-6xl {
                font-size: 1.6rem !important;
                line-height: 1 !important;
            }
            header h1 {
                font-size: 1.35rem !important;
                line-height: 1.2 !important;
                letter-spacing: 1px;
            }
            header p {
                display: none;
            }

            /* ヘッダーボタン: アイコンのみ表示 */
            header .flex.items-center.space-x-3 {
                margin-left: auto;
                gap: 4px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }
            header .flex.items-center.space-x-3 > * {
                margin: 0 !important;
            }
            header .flex.items-center.space-x-3 > button {
                padding: 0 !important;
                width: 36px;
                height: 36px;
                min-height: 36px;
                border-width: 3px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            header .flex.items-center.space-x-3 > button > span:not(:first-child) {
                display: none !important;
            }
            header .flex.items-center.space-x-3 > button > span.text-2xl {
                font-size: 1.1rem !important;
            }

            /* ヘッダーは一緒にスクロールさせ、タブだけ画面上部に固定する
               (ヘッダー＋タブ両方を固定すると画面の1/4以上が埋まり、重なりも起きるため) */
            header.sticky {
                position: relative !important;
            }
            nav.sticky {
                position: -webkit-sticky !important;
                position: sticky !important;
                top: 0 !important;
            }

            /* ===== タブ: 4つとも画面内に収める（アイコン上・ラベル下） ===== */
            nav .max-w-7xl {
                padding: 6px 4px 0 !important;
            }
            nav .flex.space-x-2 {
                gap: 4px;
            }
            nav .flex.space-x-2 > * {
                margin: 0 !important;
            }
            .tab-button {
                flex: 1 1 auto;
                min-width: 0;
                flex-direction: column;
                justify-content: center;
                gap: 2px;
                padding: 6px 4px !important;
                border-width: 3px;
                white-space: nowrap;
            }
            .tab-button > * {
                margin: 0 !important;
            }
            .tab-button svg {
                width: 16px !important;
                height: 16px !important;
                flex-shrink: 0;
            }
            .tab-button span {
                font-size: 0.68rem !important;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* メインコンテンツ（下部は同期バッジに隠れないよう余白を確保） */
            main.max-w-7xl {
                padding: 8px 8px calc(72px + env(safe-area-inset-bottom)) !important;
            }

            /* ===== はみ出し防止（汎用） ===== */
            /* 長い英単語・URL を折り返す */
            main, .fixed.inset-0 {
                overflow-wrap: anywhere;
            }
            /* フレックス内の入力欄が縮めずにはみ出すのを防ぐ */
            .flex > input, .flex > select, .flex > textarea, .flex-1 {
                min-width: 0;
            }
            /* 見出し＋ボタン群の行、ボタン群を折り返す
               (折り返さないとボタンが縦書き状態に潰れる / 画面外にはみ出す) */
            .flex.justify-between, .flex.gap-2, .flex.gap-3, .flex.gap-4 {
                flex-wrap: wrap;
            }
            /* 折り返す行で space-x-* の左マージンがずれるのを打ち消す（間隔は gap で確保） */
            .flex.flex-wrap[class*="space-x-"] > *,
            .flex.justify-between[class*="space-x-"] > * {
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
            .flex.justify-between[class*="space-x-"] {
                gap: 8px;
            }
            /* 列数指定のないグリッド（例: "grid md:grid-cols-2"）が中身に押し広げられるのを防ぐ */
            .grid:not([class*=" grid-cols-"]):not([class^="grid-cols-"]):not([class*="sm:grid-cols-"]) {
                grid-template-columns: minmax(0, 1fr);
            }
            
            /* カード: 1カラム */
            .herb-card {
                box-shadow: 4px 4px 0px #1a0b2e, inset -2px -2px 0px rgba(0, 0, 0, 0.3), inset 2px 2px 0px rgba(255, 255, 255, 0.1);
                border-width: 3px;
            }
            .herb-card:hover {
                transform: none;
                box-shadow: 4px 4px 0px #1a0b2e, inset -2px -2px 0px rgba(0, 0, 0, 0.3), inset 2px 2px 0px rgba(255, 255, 255, 0.1);
            }
            
            /* glass-panel内のpadding縮小 */
            .glass-panel {
                box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5), inset -2px -2px 0px rgba(0, 0, 0, 0.3), inset 2px 2px 0px rgba(255, 255, 255, 0.05);
                border-width: 3px;
            }
            
            /* ボタンのタッチターゲット最小サイズ確保 */
            button, a, [role="button"] {
                min-height: 40px;
            }
            
            /* ===== モーダル ===== */
            /* 背景（オーバーレイ）: 中身が画面より高い場合はスクロールできるようにする。
               上寄せ＋子要素の margin:auto で「収まる時は中央・はみ出す時は上端から」表示 */
            .fixed.inset-0 {
                padding: calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)) !important;
                align-items: flex-start !important;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }
            .fixed.inset-0 > div {
                margin-top: auto !important;
                margin-bottom: auto !important;
                max-width: 100% !important;
            }
            /* 90vh は iOS Safari ではツールバー分だけ画面からはみ出す → 実際の表示領域 (dvh) を使う */
            .fixed.inset-0 > .max-h-\[90vh\] {
                max-height: calc(100vh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
                max-height: calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
            }
            /* モーダル内の余白をスマホ向けに縮小 */
            .fixed.inset-0 > .p-8 {
                padding: 16px !important;
            }
            .fixed.inset-0 .p-6 {
                padding: 14px !important;
            }
            .fixed.inset-0 .px-6 {
                padding-left: 14px !important;
                padding-right: 14px !important;
            }
            .fixed.inset-0 .py-5 {
                padding-top: 12px !important;
                padding-bottom: 12px !important;
            }
            
            /* 通知の位置調整 */
            .notification {
                max-width: calc(100vw - 16px) !important;
                right: 8px !important;
                font-size: 0.75rem !important;
            }
            
            /* フォントサイズ調整 */
            .text-5xl { font-size: 1.5rem !important; }
            .text-4xl { font-size: 1.3rem !important; }
            .text-3xl { font-size: 1.1rem !important; }
            .text-2xl { font-size: 1rem !important; }
            .text-xl { font-size: 0.9rem !important; }
            
            /* ネオンボーダー簡略化 */
            .neon-border {
                box-shadow: 0 0 0 3px #ff6b9d, 0 0 0 6px #feca57, inset 0 0 0 3px rgba(255, 107, 157, 0.3);
            }
            
            /* グリッド1列化
               (1fr だと中身の最小幅に押し広げられて画面外にはみ出すため minmax(0, 1fr)) */
            .grid-cols-2, .grid-cols-3 {
                grid-template-columns: minmax(0, 1fr) !important;
            }

            /* スクロールバー非表示（タッチデバイス） */
            ::-webkit-scrollbar { width: 0; height: 0; }

            /* 妖精: 画面が小さいので縮小して表示
               (以前は非表示にしていたため「来てもらう」ボタンを押しても何も起きなかった) */
            .fixed.pointer-events-none.z-50 {
                transform: scale(0.6);
                transform-origin: top left;
            }
        }

        /* --- 幅の狭いスマホ (〜389px: iPhone SE / mini, 多くのAndroid) --- */
        @media (max-width: 389px) {
            /* ヘッダーを1行に収めるため🌿アイコンを省略 */
            header .text-6xl {
                display: none;
            }
            header .flex.items-center.space-x-4 > * + * {
                margin-left: 0 !important;
            }
        }

        /* --- タブレット (768px〜1023px) --- */
        @media (min-width: 768px) and (max-width: 1023px) {
            header h1 {
                font-size: 2rem !important;
            }
            header .text-6xl {
                font-size: 3rem !important;
            }
            
            /* ヘッダーボタンのテキスト非表示 */
            header .flex.items-center.space-x-3 > button > span:not(:first-child) {
                display: none !important;
            }
            
            .tab-button {
                padding: 10px 14px !important;
                font-size: 0.8rem !important;
            }
            
            main.max-w-7xl {
                padding: 12px !important;
            }
        }

        /* --- PWAインストールバナー --- */
        .pwa-install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(45, 27, 78, 0.98) 0%, rgba(26, 11, 46, 0.98) 100%);
            border-top: 4px solid #feca57;
            padding: 12px 16px;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-family: 'DotGothic16', monospace;
            animation: pixel-slide-up 0.5s steps(10);
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        .pwa-install-banner.hidden {
            display: none;
        }
        @keyframes pixel-slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        /* --- PWAスプラッシュスクリーン（初回ロード） --- */
        #pwa-splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a0b2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s;
        }
        #pwa-splash.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        #pwa-splash .splash-title {
            font-family: 'Silkscreen', 'Press Start 2P', monospace;
            font-size: 2rem;
            background: linear-gradient(45deg, #ff6b9d, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pixel-gradient 2s steps(8) infinite;
            margin-top: 16px;
        }
        #pwa-splash .splash-sub {
            color: #feca57;
            font-family: 'DotGothic16', monospace;
            font-size: 0.8rem;
            margin-top: 8px;
        }
        #pwa-splash .splash-loader {
            margin-top: 24px;
            width: 48px; height: 48px;
            border: 4px solid #5e2563;
            border-top: 4px solid #feca57;
            animation: pixel-spin 1s steps(8) infinite;
        }
    </style>
</head>
<body>
    <!-- スプラッシュスクリーン -->
    <div id="pwa-splash">
        <div style="font-size: 4rem;">🌿</div>
        <div class="splash-title">Jīvaka</div>
        <div class="splash-sub">~ 8bit Ayurveda ~</div>
        <div class="splash-loader"></div>
    </div>

    <div id="root"></div>

    <!-- PWAインストールバナー（iOSのSafari用） -->
    <div id="pwa-install-banner" class="pwa-install-banner hidden">
        <div>
            <div style="color: #feca57; font-size: 0.9rem; font-weight: bold;">📱 ホーム画面に追加</div>
            <div style="color: #ff9ff3; font-size: 0.7rem; margin-top: 2px;">
                Safari の <span style="font-size: 1.1em;">⬆️</span> → 「ホーム画面に追加」でアプリとして使えます
            </div>
        </div>
        <button 
            onclick="document.getElementById('pwa-install-banner').classList.add('hidden'); localStorage.setItem('pwa-banner-dismissed', '1');"
            style="background: none; border: 2px solid #feca57; color: #feca57; padding: 6px 12px; font-family: 'DotGothic16', monospace; font-size: 0.75rem; cursor: pointer; white-space: nowrap;"
        >
            OK
        </button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config（自分のプロジェクト設定を入力） -->
    <script src="firebase-config.js"></script>

    <!-- Storage Adapter（IndexedDB + Firebase Sync） -->
    <script src="storage-adapter-firebase.js"></script>
    
    <!-- メインアプリ -->
    <script type="text/babel" src="renderer.js"></script>

    <!-- Service Worker 登録 & PWAバナー制御 -->
    <script>
        // Service Worker登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('🌿 SW registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }

        // スプラッシュスクリーンを非表示
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('pwa-splash');
                if (splash) {
                    splash.classList.add('fade-out');
                    setTimeout(() => splash.remove(), 600);
                }
            }, 1500);
        });

        // iOSでSafariから閲覧中 & まだスタンドアロンでない場合にバナー表示
        (function() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
            const dismissed = localStorage.getItem('pwa-banner-dismissed');
            
            if (isIOS && !isStandalone && !dismissed) {
                setTimeout(() => {
                    document.getElementById('pwa-install-banner').classList.remove('hidden');
                }, 3000);
            }
        })();
    </script>
</body>
</html>
